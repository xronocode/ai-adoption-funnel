<svg viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Воронка AI Power Users, 1 кв. 2026</title>
<rect x="0" y="0" width="680" height="580" fill="#ffffff"/>
<text x="20" y="26" font-size="14" font-weight="600" fill="#1a1a1a">От миллиарда к сотням: воронка продвинутых пользователей ИИ</text>
<text x="20" y="44" font-size="12" fill="#6b6b6b">1 кв. 2026 · центральные оценки · методология на GitHub</text>

<rect x="20" y="62" width="10" height="10" rx="2" fill="#1D9E75"/>
<text x="36" y="71" font-size="11" fill="#6b6b6b">измерено в опросе (доля)</text>
<rect x="210" y="62" width="10" height="10" rx="2" fill="#888780"/>
<text x="226" y="71" font-size="11" fill="#6b6b6b">базовая популяция</text>
<rect x="370" y="62" width="10" height="10" rx="2" fill="#D85A30"/>
<text x="386" y="71" font-size="11" fill="#6b6b6b">модельная оценка</text>

<g transform="translate(0,92)">
<rect x="160" y="0" width="360" height="42" rx="4" fill="#F1EFE8"/>
<text x="340" y="26" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">1 млрд</text>
<text x="150" y="26" font-size="13" font-weight="500" text-anchor="end" fill="#1a1a1a">Умственный труд</text>
<text x="530" y="22" font-size="11" fill="#6b6b6b">0.64–1.0 млрд</text>
<text x="530" y="36" font-size="11" fill="#9b9b9b">ILO / WEF</text>
<text x="340" y="58" font-size="11" font-weight="500" text-anchor="middle" fill="#9b9b9b">÷ 3.3</text>

<rect x="171" y="66" width="338" height="42" rx="4" fill="#E1F5EE"/>
<text x="340" y="92" font-size="14" font-weight="600" text-anchor="middle" fill="#0F6E56">307 млн</text>
<text x="161" y="92" font-size="13" font-weight="500" text-anchor="end" fill="#1a1a1a">Эпизодические</text>
<text x="519" y="88" font-size="11" font-weight="500" fill="#1a1a1a">50% США</text>
<text x="519" y="102" font-size="11" fill="#9b9b9b">Gallup</text>
<text x="340" y="124" font-size="11" font-weight="500" text-anchor="middle" fill="#9b9b9b">÷ 11</text>

<rect x="195" y="132" width="290" height="42" rx="4" fill="#E1F5EE"/>
<text x="340" y="158" font-size="14" font-weight="600" text-anchor="middle" fill="#0F6E56">27.6 млн</text>
<text x="185" y="158" font-size="13" font-weight="500" text-anchor="end" fill="#1a1a1a">Передовые спец.</text>
<text x="495" y="154" font-size="11" font-weight="500" fill="#1a1a1a">16% польз. ИИ</text>
<text x="495" y="168" font-size="11" fill="#9b9b9b">Microsoft WTI</text>
<text x="340" y="190" font-size="11" font-weight="500" text-anchor="middle" fill="#9b9b9b">÷ 6</text>

<rect x="212" y="198" width="256" height="42" rx="4" fill="#E1F5EE"/>
<text x="340" y="224" font-size="14" font-weight="600" text-anchor="middle" fill="#0F6E56">4.6 млн</text>
<text x="202" y="224" font-size="13" font-weight="500" text-anchor="end" fill="#1a1a1a">Агентная разработка</text>
<text x="478" y="220" font-size="11" font-weight="500" fill="#1a1a1a">31.8% разраб.</text>
<text x="478" y="234" font-size="11" fill="#9b9b9b">Stack Overflow</text>
<text x="340" y="256" font-size="11" font-weight="500" text-anchor="middle" fill="#9b9b9b">÷ 9.5</text>

<rect x="234" y="264" width="212" height="42" rx="4" fill="#FAECE7"/>
<text x="340" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#993C1D">486 тыс.</text>
<text x="224" y="290" font-size="13" font-weight="500" text-anchor="end" fill="#1a1a1a">Топ-менеджеры</text>
<text x="456" y="290" font-size="11" fill="#9b9b9b">модель</text>
<text x="340" y="322" font-size="11" font-weight="500" text-anchor="middle" fill="#9b9b9b">÷ 14</text>

<rect x="261" y="330" width="158" height="42" rx="4" fill="#FAECE7"/>
<text x="340" y="356" font-size="14" font-weight="600" text-anchor="middle" fill="#993C1D">35 тыс.</text>
<text x="251" y="356" font-size="13" font-weight="500" text-anchor="end" fill="#1a1a1a">Создатели ИИ-платформ</text>
<text x="429" y="352" font-size="11" fill="#9b9b9b">интервал 15–75 тыс.</text>
<text x="429" y="366" font-size="11" fill="#9b9b9b">модель</text>
<text x="340" y="388" font-size="11" font-weight="500" text-anchor="middle" fill="#9b9b9b">÷ 49</text>

<rect x="298" y="396" width="84" height="42" rx="4" fill="#FAECE7"/>
<text x="340" y="422" font-size="14" font-weight="600" text-anchor="middle" fill="#993C1D">~720</text>
<text x="288" y="422" font-size="13" font-weight="500" text-anchor="end" fill="#1a1a1a">Регулируемые отрасли</text>
<text x="392" y="418" font-size="11" fill="#9b9b9b">интервал 191–2085</text>
<text x="392" y="432" font-size="11" fill="#9b9b9b">эксперт. оценка</text>
</g>
<line x1="20" y1="546" x2="660" y2="546" stroke="#e8e8e8" stroke-width="1"/>
<text x="20" y="566" font-size="11" fill="#6b6b6b">÷ N — во сколько раз слой меньше предыдущего. Сжатие растёт книзу: ÷3.3 → ÷49.</text>
</svg>
