name: verify

on: [push, pull_request]

jobs:
  verify-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify published numbers against the Monte Carlo
        run: python scripts/verify_numbers.py
